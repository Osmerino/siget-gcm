<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGET Mobile - GCM Mariana</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#070d19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SIGET">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063822.png">

    <style>
        :root {
            --primary-color: #0b1325;
            --secondary-color: #1b2a47;
            --accent-color: #d4af37;
            --warning-color: #e67e22;
            --danger-color: #c0392b;
            --info-color: #2980b9;
            --bg-color: #070d19;
            --card-bg: rgba(13, 27, 50, 0.95);
            --text-color: #e0e6ed;
            --border-color: rgba(212, 175, 55, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding-bottom: 20px;
        }

        /* --- TELA DE LOGIN MOBILE --- */
        #sec-login {
            display: flex;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #070d19 0%, #0d1b32 100%);
            color: #ffffff;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-brand {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .login-divider {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-color) 0%, transparent 100%);
            margin: 10px 0 15px 0;
        }

        .login-sub {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #a0b2ce;
            text-transform: uppercase;
        }

        .login-org {
            font-size: 0.7rem;
            color: var(--accent-color);
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .login-card {
            background: rgba(13, 27, 50, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            text-align: left;
        }

        .login-card input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: #fff;
            margin-bottom: 15px;
            height: 48px;
            font-size: 1rem;
            padding: 0 12px;
            border-radius: 6px;
        }

        .btn-tatico {
            background: var(--accent-color);
            color: #0b1325;
            font-weight: bold;
            letter-spacing: 1px;
            border: none;
            height: 50px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: all 0.2s;
        }

        /* --- CONTAINER PRINCIPAL MOBILE --- */
        .container {
            width: 100%;
            padding: 15px;
            display: none;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent-color);
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        header p {
            color: #a0b2ce;
            font-size: 0.8rem;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(27, 42, 71, 0.9);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .nav-links-row {
            display: flex;
            justify-content: space-around;
            margin-top: 5px;
            font-size: 0.85rem;
        }

        .nav-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        .user-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
        }

        .badge-op { background: #1b2a47; color: var(--accent-color); border: 1px solid var(--border-color); }
        .badge-admin { background: #155724; color: #d4edda; border: 1px solid #28a745; }

        .section { display: none; }
        .section.active { display: block; }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="password"],
        input[type="date"],
        input[type="time"],
        input[type="number"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            height: 48px;
            padding: 0 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            color: #ffffff;
        }

        textarea {
            height: 80px;
            padding: 10px 12px;
        }

        select option {
            background-color: #0b1325;
            color: #ffffff;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-group-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            background-color: var(--accent-color);
            color: #0b1325;
            height: 50px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-secondary { background-color: #4a5568; color: #ffffff; }
        .btn-success { background-color: #27ae60; color: #fff; }
        .btn-warning { background-color: var(--warning-color); color: white; }
        .btn-danger { background-color: var(--danger-color); color: white; height: 38px; font-size: 0.85rem; border-radius: 4px; }
        .btn-info { background-color: var(--info-color); color: white; height: 38px; font-size: 0.85rem; border-radius: 4px; }

        /* DASHBOARD MOBILE */
        .dash-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .dash-card {
            background: rgba(27, 42, 71, 0.7);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .dash-card h3 {
            font-size: 0.7rem;
            color: #a0b2ce;
            text-transform: uppercase;
        }

        .dash-card .number {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent-color);
        }

        .user-card, .warning-card {
            background: rgba(27, 42, 71, 0.7);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-color);
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
            background: #1b2a47;
            flex-shrink: 0;
        }

        #webcam-box {
            display: none;
            text-align: center;
            margin-top: 10px;
            background: #000;
            padding: 10px;
            border-radius: 8px;
        }

        #webcam-video {
            width: 100%;
            max-width: 280px;
            border-radius: 6px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }

        .modal-content {
            background: #0d1b32;
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        table th, table td {
            border: 1px solid var(--border-color);
            padding: 8px;
        }
    </style>
</head>
<body>

<div id="sec-login">
    <div class="login-box">
        <div class="login-brand">SIGET</div>
        <div class="login-divider"></div>
        <div class="login-sub">ESTANDE INSTITUCIONAL DE TIRO</div>
        <div class="login-org">GCM MARIANA — MG</div>

        <div class="login-card">
            <form onsubmit="autenticarOperador(event)">
                <div class="form-group">
                    <label>MATRÍCULA FUNCIONAL:</label>
                    <input type="text" id="login-usuario" required placeholder="Digite sua matrícula">
                </div>
                <div class="form-group">
                    <label>SENHA DE ACESSO:</label>
                    <input type="password" id="login-senha" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-tatico">ENTRAR NO SISTEMA</button>
            </form>
            <div style="text-align: center; margin-top: 15px;">
                <a href="#" style="color: var(--accent-color); font-size: 0.8rem;" onclick="irParaPrimeiroAcesso()">Primeiro acesso? Cadastre-se aqui</a>
            </div>
        </div>
    </div>
</div>

<div id="app-container" class="container">
    <header>
        <h1>ESTANDE DE TIRO</h1>
        <p>GCM Mariana - MG | Versão Mobile</p>
    </header>

    <nav>
        <div>
            <span id="user-status" class="user-badge badge-op">Operador Conectado</span>
        </div>
        <div class="nav-links-row">
            <a class="nav-link" onclick="showSection('sec-busca')">Início</a> | 
            <a class="nav-link" onclick="solicitarAcessoAdmin()">Relatórios</a> | 
            <a class="nav-link" style="color: var(--danger-color);" onclick="solicitarEncerramentoSessao()">Sair</a>
        </div>
    </nav>

    <div id="sec-busca" class="section active">
        <h2>Identificação do Servidor</h2>
        <form id="form-busca" onsubmit="buscarMatricula(event)" style="margin-top: 15px;">
            <div class="form-group">
                <label>Matrícula / ID Funcional:</label>
                <input type="text" id="busca-matricula" required placeholder="Ex: 123456">
            </div>
            <button type="submit" class="btn">Verificar Matrícula</button>
        </form>
    </div>

    <div id="sec-cadastro" class="section">
        <h2 id="titulo-cadastro">Cadastro Completo</h2>
        
        <form id="form-cadastro" onsubmit="salvarCadastro(event)" style="margin-top: 15px;">
            <input type="hidden" id="cad-matricula">
            
            <div class="form-group">
                <label>Nome Completo:</label>
                <input type="text" id="cad-nome" required>
            </div>

            <div class="form-group">
                <label>Cargo / Função:</label>
                <input type="text" id="cad-cargo" required placeholder="Ex: Agente">
            </div>

            <div class="form-group">
                <label>Senha de Acesso:</label>
                <input type="password" id="cad-senha" required placeholder="Crie uma senha">
            </div>

            <div class="form-group">
                <label>Foto do Servidor:</label>
                <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                    <button type="button" class="btn btn-info" style="flex:1;" onclick="iniciarWebcam()">📷 Câmera</button>
                    <input type="file" id="cad-foto" accept="image/*" capture="user" onchange="previewFoto(event)" style="display:none;">
                    <button type="button" class="btn btn-secondary" style="flex:1; height:38px; font-size:0.85rem;" onclick="document.getElementById('cad-foto').click()">📂 Galeria</button>
                </div>

                <div id="webcam-box">
                    <video id="webcam-video" autoplay playsinline></video>
                    <div style="margin-top: 8px; display: flex; gap: 8px;">
                        <button type="button" class="btn btn-success" style="height: 38px; font-size: 0.85rem;" onclick="capturarFotoWebcam()">📸 Tirar Foto</button>
                        <button type="button" class="btn btn-danger" style="height: 38px; font-size: 0.85rem;" onclick="pararWebcam()">Fechar</button>
                    </div>
                </div>

                <div style="text-align: center; margin-top: 8px;">
                    <img id="img-preview" src="" alt="Foto" style="max-width: 100px; max-height: 100px; display: none; border-radius: 50%; border: 2px solid var(--accent-color);">
                </div>
            </div>

            <div class="form-group">
                <label>Possui Arma Particular?</label>
                <select id="cad-tem-particular" onchange="toggleArmaParticular()">
                    <option value="Não">Não</option>
                    <option value="Sim">Sim</option>
                </select>
            </div>
            <div id="box-particular" style="display: none;">
                <div class="form-group"><label>Nº do CRAF:</label><input type="text" id="cad-craf"></div>
                <div class="form-group"><label>Modelo/Calibre:</label><input type="text" id="cad-particular-desc"></div>
            </div>

            <div class="form-group">
                <label>Possui Cautela Fixa?</label>
                <select id="cad-tem-cautela" onchange="toggleCautela()">
                    <option value="Não">Não</option>
                    <option value="Sim">Sim</option>
                </select>
            </div>
            <div id="box-cautela" style="display: none;">
                <div class="form-group"><label>Nº Termo Cautela:</label><input type="text" id="cad-num-cautela"></div>
                <div class="form-group"><label>Modelo/Calibre:</label><input type="text" id="cad-institucional-desc"></div>
            </div>

            <div class="btn-group-row">
                <button type="button" class="btn btn-secondary" onclick="voltarParaBusca()">← Voltar</button>
                <button type="submit" id="btn-cadastrar" class="btn btn-success">Salvar Cadastro</button>
            </div>
        </form>
    </div>

    <div id="sec-acesso" class="section">
        <div id="servidor-info" class="user-card"></div>
        <h2>Entrada no Estande</h2>

        <form id="form-acesso" onsubmit="salvarAcessoDiario(event)" style="margin-top: 15px;">
            <input type="hidden" id="acesso-matricula">

            <div class="form-group"><label>Data Entrada:</label><input type="date" id="acesso-data" required></div>
            <div class="form-group"><label>Hora Entrada:</label><input type="time" id="acesso-hora-in" required></div>

            <div class="form-group">
                <label>Arma Utilizada:</label>
                <select id="acesso-tipo-arma" required>
                    <option value="Arma Particular">Arma Particular</option>
                    <option value="Cautela Fixa (Institucional)">Cautela Fixa (Institucional)</option>
                    <option value="Cautela Avulsa (Dia)">Cautela Avulsa (Dia)</option>
                    <option value="Sem Arma / Instrução">Sem Arma / Instrução</option>
                </select>
            </div>

            <div class="form-group"><label>Nº Série da Arma:</label><input type="text" id="acesso-serie-arma" required></div>
            <div class="form-
